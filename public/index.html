<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogue Store 🛒</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-amber-400">⚡ ROGUE STORE</h1>
            <div class="flex items-center gap-4">
                <span id="cart-count" class="bg-amber-500 text-black px-3 py-1 rounded-full text-sm font-semibold">Cart: 0</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-6">
        <div class="text-center my-8">
            <h2 class="text-3xl font-extrabold mb-2">Explore Our Collection</h2>
            <p class="text-gray-400">Custom cloud-powered e-commerce store connected with MongoDB Atlas.</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Products will be loaded here dynamically via JavaScript -->
            <p class="text-gray-500 col-span-full text-center py-10">Loading products from database...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-gray-500 text-sm border-t border-gray-800 mt-12">
        Powered by Vercel & MongoDB Atlas 🚀
    </footer>

    <script src="script.js"></script>
</body>
</html>
